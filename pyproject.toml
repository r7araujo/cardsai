  [build-system]
  requires = ["setuptools>=77"]
  build-backend = "setuptools.build_meta"

  [project]
  name = "cardsai"
  version = "0.1.0"
  description = "A flashcards generator to study languages."
  readme = "README.md"
  requires-python = ">=3.11"
  dependencies = []

  [project.optional-dependencies]
  dev = [
      "pytest>=8.0",
  ]

  [tool.pytest.ini_options]
  pythonpath = ["src"]
  testpaths = ["tests"]